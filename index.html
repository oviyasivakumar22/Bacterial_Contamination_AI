<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Surface Contamination Screening</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>AI Surface Contamination Screening</h1>
            <p>Medical Equipment Surface Analysis</p>
        </header>

        <main>

            <!-- Camera Section -->
            <section class="card">

                <h2>Surface Screening</h2>

                <div class="camera-box">
                    <video id="camera" autoplay playsinline></video>
                </div>

                <div class="buttons">

                    <button id="startCamera" class="primary">
                        Start Camera
                    </button>

                    <button id="captureImage" class="success">
                        Capture & Screen
                    </button>

                    <button id="retake" class="secondary">
                        Retake
                    </button>

                </div>

                <canvas id="canvas"></canvas>

            </section>


            <!-- Result Section -->
            <section class="card result-card">

                <h2>Screening Result</h2>

                <div id="resultIcon">🔍</div>

                <p id="status">
                    AI model is loading...
                </p>

            </section>


            <!-- Treatment Recommendation -->
            <section id="treatmentBox" class="card treatment-card">

                <h2>Recommended Action</h2>

                <p id="treatmentText">
                    Screening required before treatment recommendation.
                </p>

            </section>

        </main>

        <footer>
            <p>AI-assisted surface contamination screening prototype</p>
        </footer>

    </div>


    <!-- AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
